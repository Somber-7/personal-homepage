name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # postinstall에서 prisma generate가 돈다. DB 연결 없이도 된다
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # 빌드는 DB를 읽어 정적 페이지를 만들기 때문에 Vercel 배포에서 확인한다
